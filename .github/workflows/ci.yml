name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `node:sqlite` dipakai driver lokal dan skrip; butuh Node 22+
          node-version: '22'
          cache: npm
      - run: npm ci
      # typecheck → test (health, gateway, golden set, API, orkestrasi) → build → smoke runtime
      - run: npm run verify
